<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SiteSnap — Sites</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#F3F4F6;--accent:#0F766E;--border:#E5E7EB;--text:#111827;--muted:#6B7280}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}
  header{height:56px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700}
  .mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#0F766E,#14B8A6);color:#fff;display:grid;place-items:center;font-size:12px}
  .btn{border:1px solid var(--border);background:#fff;border-radius:10px;padding:8px 14px;font:inherit;font-size:13px;font-weight:600}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  main{max-width:720px;margin:0 auto;padding:28px 24px}
  h2{font-size:18px;margin-bottom:16px}
  .list{display:flex;flex-direction:column;gap:10px}
  .row{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center}
  .row h3{font-size:15px;font-weight:600}
  .row p{font-size:12px;color:var(--muted);margin-top:4px}
  .meta{font-size:12px;color:var(--muted);font-weight:500}
</style>
</head>
<body>
  <header>
    <div class="brand"><span class="mark">SS</span> SiteSnap</div>
    <button class="btn primary">+ Create site</button>
  </header>
  <main>
    <h2>Sites</h2>
    <div class="list">
      <div class="row">
        <div><h3>42 River Rd — reno</h3><p>Last upload today · 14 photos</p></div>
        <span class="meta">Open →</span>
      </div>
      <div class="row">
        <div><h3>Harbour St fit-out</h3><p>Last upload yesterday · 31 photos</p></div>
        <span class="meta">Open →</span>
      </div>
      <div class="row">
        <div><h3>Workshop yard</h3><p>Last upload 3 days ago · 8 photos</p></div>
        <span class="meta">Open →</span>
      </div>
    </div>
  </main>
</body>
</html>
