<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SiteSnap — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#F3F4F6; --accent:#0F766E; --border:#E5E7EB; --muted:#6B7280; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,system-ui,sans-serif;background:var(--bg);min-height:100vh;display:grid;place-items:center}
  .card{width:380px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:32px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
  .mark{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#0F766E,#14B8A6);color:#fff;display:grid;place-items:center;font-weight:700;margin-bottom:16px}
  h1{font-size:20px;margin-bottom:6px}
  p{font-size:13px;color:var(--muted);margin-bottom:22px}
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px}
  input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font:inherit;font-size:15px;margin-bottom:16px}
  button{width:100%;border:0;background:var(--accent);color:#fff;font:inherit;font-weight:700;padding:14px;border-radius:12px}
</style>
</head>
<body>
  <div class="card">
    <div class="mark">SS</div>
    <h1>SiteSnap Admin</h1>
    <p>Password to view sites and photos.</p>
    <label>Password</label>
    <input type="password" value="••••••••" />
    <button>Enter</button>
  </div>
</body>
</html>
