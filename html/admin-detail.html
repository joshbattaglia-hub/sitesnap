<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SiteSnap — Site detail</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#F3F4F6;--accent:#0F766E;--border:#E5E7EB;--text:#111827;--muted:#6B7280}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}
  header{height:56px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;color:var(--muted)}
  .brand strong{color:var(--text)}
  .actions{display:flex;gap:8px}
  .btn{border:1px solid var(--border);background:#fff;border-radius:10px;padding:8px 14px;font:inherit;font-size:13px;font-weight:600}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  main{max-width:900px;margin:0 auto;padding:24px}
  h1{font-size:22px;margin-bottom:6px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
  .day{margin-bottom:28px}
  .day h2{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:12px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .ph{aspect-ratio:1;border-radius:12px;background:linear-gradient(135deg,#CCFBF1,#99F6E4);border:1px solid var(--border);position:relative;overflow:hidden}
  .ph:nth-child(2){background:linear-gradient(135deg,#E5E7EB,#D1D5DB)}
  .ph:nth-child(3){background:linear-gradient(135deg,#FEF3C7,#FDE68A)}
  .ph:nth-child(4){background:linear-gradient(135deg,#DBEAFE,#93C5FD)}
  .ph span{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:3px 6px;border-radius:6px}
</style>
</head>
<body>
  <header>
    <div class="brand">Sites / <strong>42 River Rd — reno</strong></div>
    <div class="actions">
      <button class="btn">Copy upload link</button>
      <button class="btn primary">+ Create site</button>
    </div>
  </header>
  <main>
    <h1>42 River Rd — reno</h1>
    <p class="sub">Upload link ready for contractors · 14 photos</p>

    <section class="day">
      <h2>Today — 18 Sep</h2>
      <div class="grid">
        <div class="ph"><span>08:12</span></div>
        <div class="ph"><span>08:14</span></div>
        <div class="ph"><span>11:02</span></div>
        <div class="ph"><span>15:40</span></div>
      </div>
    </section>
    <section class="day">
      <h2>Yesterday — 17 Sep</h2>
      <div class="grid">
        <div class="ph"><span>09:01</span></div>
        <div class="ph"><span>09:03</span></div>
        <div class="ph"><span>16:22</span></div>
        <div class="ph"><span>16:25</span></div>
      </div>
    </section>
  </main>
</body>
</html>
